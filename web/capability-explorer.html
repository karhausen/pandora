<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pandora Capability Explorer</title>
  <link rel="stylesheet" href="/web/shared.css" />
  <link rel="stylesheet" href="/web/capability-explorer.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Capability Explorer</h1>
        <p>Fähigkeiten, Tools, Skills, Wissensquellen und offene Lücken sichtbar miteinander verbinden.</p>
      </div>
      <nav class="hero-actions" aria-label="Pandora Navigation">
        <a class="badge link" href="/">User GUI</a>
        <a class="badge link primary" href="/capability-explorer">Capability Explorer</a>
        <a class="badge link" href="/knowledge-base">Knowledge Base</a>
        <a class="badge link" href="/tools-center">Tool Center</a>
        <a class="badge link" href="/skills-center">Skill Center</a>
        <a class="badge link" href="/operations">Operations Dashboard</a>
      </nav>
    </header>

    <section class="summary-grid">
      <article class="card"><span class="label">Capabilities</span><strong id="capabilityCount">–</strong></article>
      <article class="card"><span class="label">Nodes</span><strong id="nodeCount">–</strong></article>
      <article class="card"><span class="label">Edges</span><strong id="edgeCount">–</strong></article>
      <article class="card"><span class="label">Stand</span><strong id="updatedAt">–</strong></article>
    </section>

    <section class="toolbar">
      <input id="queryInput" type="search" placeholder="Capability suchen, z. B. funktechnik" oninput="loadCapabilities()" />
      <button class="badge link primary" type="button" onclick="rebuildGraph()">Graph neu aufbauen</button>
      <button class="badge link" type="button" onclick="loadDashboard()">Aktualisieren</button>
      <span id="statusText">Bereit</span>
    </section>

    <section class="layout">
      <aside class="capability-list" id="capabilityList"></aside>
      <section class="capability-detail">
        <div id="capabilityDetail" class="empty">Wähle eine Capability aus.</div>
        <div class="relation-grid" id="relationGrid"></div>
        <details>
          <summary>Raw Graph Detail</summary>
          <pre id="rawCapability">{}</pre>
        </details>
      </section>
    </section>
  </main>
  <script src="/web/capability-explorer.js"></script>
</body>
</html>
