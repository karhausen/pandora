<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pandora Memory Explorer</title>
  <link rel="stylesheet" href="/web/shared.css" />
  <link rel="stylesheet" href="/web/memory-explorer.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Memory Explorer</h1>
        <p>Read-only Übersicht über Pandora Memory, Logs und Proposal-Artefakte.</p>
      </div>
      <nav class="global-nav" aria-label="Hauptnavigation">
        <a class="badge link" href="/">Chat</a>
        <a class="badge link primary" href="/knowledge-base">Knowledge</a>
        <a class="badge link" href="/capability-explorer">Capabilities</a>
        <a class="badge link" href="/operations">Operations</a>
        <a class="badge link" href="/llm-profiles">Profiles</a>
      </nav>
    </header>
    <section class="badge-row" aria-label="Knowledge Unterbereiche">
      <a class="badge link" href="/knowledge-base">Knowledge Base</a>
      <a class="badge link" href="/knowledge-editor">Knowledge Editor</a>
      <a class="badge link" href="/memory-explorer">Memory Explorer</a>
    </section>


    <section class="summary-grid">
      <article class="card"><span class="label">Bereiche</span><strong id="areaCount">–</strong></article>
      <article class="card"><span class="label">Dateien</span><strong id="fileCount">–</strong></article>
      <article class="card"><span class="label">Speicher</span><strong id="byteCount">–</strong></article>
      <article class="card"><span class="label">Modus</span><strong>Read-only</strong></article>
    </section>

    <section class="toolbar">
      <button class="badge link" type="button" onclick="loadMemoryExplorer()">Aktualisieren</button>
      <input id="searchInput" placeholder="Suche in Memory/Proposals ..." onkeydown="if(event.key==='Enter') searchMemory()" />
      <button class="badge link" type="button" onclick="searchMemory()">Suchen</button>
      <span id="statusText">Bereit</span>
    </section>

    <section class="layout">
      <aside class="memory-list" id="areaList"></aside>
      <aside class="memory-list" id="fileList"></aside>
      <section class="memory-detail">
        <div id="memoryDetail" class="empty">Wähle einen Bereich oder eine Datei aus.</div>
        <pre id="rawMemory">{}</pre>
      </section>
    </section>

    <section class="panel">
      <h2>Suchergebnisse</h2>
      <div id="searchResults" class="compact-list"></div>
    </section>
  </main>
  <script src="/web/memory-explorer.js"></script>
</body>
</html>
