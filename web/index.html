<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pandora</title>
  <link rel="stylesheet" href="/web/user.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Pandora</h1>
        <p>Dein lokaler KI-Agent.</p>
      </div>
      <a class="admin-link" href="/admin">Admin</a>
    </header>

    <section class="session-bar" id="sessionBar"><button onclick="newSession()">Neue Unterhaltung</button><select id="sessionSelect" onchange="switchSession()"></select></section>

    <section class="composer">
      <textarea id="taskInput" placeholder="Was soll Pandora tun?">Bitte rechne 2+3*4</textarea>
      
<div class="provider-row">
  <label>
    Provider
    <select id="providerSelect">
      <option value="mock">mock</option>
      <option value="local_fast">local_fast</option>
      <option value="lmstudio">lmstudio</option>
      <option value="ollama">ollama</option>
      <option value="openai">openai</option>
    </select>
  </label>
  <label>
    Modell optional
    <input id="modelInput" placeholder="z.B. qwen/qwen3-1.7b" />
  </label>
</div>

<div class="actions">
        <button id="runButton" onclick="runPandora()">Ausführen</button>
        <span id="statusText">Bereit</span>
      </div>
    </section>

    <section id="chat" class="chat"></section>


<section id="details" class="details hidden">
  <details open>
    <summary>Coordinator anzeigen</summary>
    <pre id="decisionBox">{}</pre>
  </details>
  <details>
    <summary>Plan anzeigen</summary>
    <pre id="planBox">{}</pre>
  </details>
  <details>
    <summary>Ausführung anzeigen</summary>
    <pre id="executionBox">{}</pre>
  </details>
</section>
  </main>

  <script src="/web/user.js"></script>
</body>
</html>
