<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pandora Evolution</title>
  <link rel="stylesheet" href="/web/evolution.css?v=28.4">
</head>
<body>
  <main class="evolution-shell">
    <header class="evolution-hero">
      <div>
        <span class="eyebrow">MVP 28.4</span>
        <h1>Pandora Genome & Evolution Model</h1>
        <p>Single Source of Truth für Identität, Regeln, Lifecycle und künftige Verbesserungsvorschläge.</p>
      </div>
      <nav class="hero-actions">
        <a class="secondary-button" href="/maintenance">Maintenance</a>
        <a class="back-button" href="/">Chat</a>
      </nav>
    </header>

    <section class="status-panel" id="statusPanel">Lade Evolution Status ...</section>

    <section class="grid">
      <article class="card">
        <h2>Genome</h2>
        <div id="genomeSections" class="section-list"></div>
      </article>
      <article class="card">
        <h2>Lifecycle</h2>
        <div id="lifecycleSteps" class="timeline"></div>
      </article>
      <article class="card">
        <h2>Proposal Types</h2>
        <div id="proposalTypes" class="chips"></div>
      </article>
      <article class="card">
        <h2>Rules</h2>
        <div id="rules" class="rule-list"></div>
      </article>
    </section>
  </main>
  <script src="/web/evolution.js?v=28.4"></script>
</body>
</html>
