services:
  pandora:
    build: .
    container_name: pandora-control-core
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./memory:/app/memory
      - ./config:/app/config
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "main.py", "heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
